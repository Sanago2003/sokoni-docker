version: "3.8"

services:
  web:
    build: .
    container_name: peter_sokoni_web
    ports:
      - "31080:80"
    depends_on:
      - db
    volumes:
      - ./app:/var/www/html
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: peter_sokoni_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: sokoni
    volumes:
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - db_data:/var/lib/mysql

volumes:
  db_data:
    name: peter_sokoni_db_data
