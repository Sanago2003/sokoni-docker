name: CI/CD Pipeline with Security Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 🔒 SECURITY GATE 1: Secrets Scanning
      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@v2
        continue-on-error: true

      # 🔒 SECURITY GATE 2: SAST (Static Application Security Testing)
      - name: Semgrep scan
        run: |
          pip install semgrep
          semgrep --config auto ./app || true

      # 🔒 SECURITY GATE 3: SCA (Software Composition Analysis)
      - name: Dependency scan (Safety)
        run: |
          pip install safety
          if [ -f app/requirements.txt ]; then
            safety check -r app/requirements.txt || true
          else
            echo "No requirements.txt — skipping dependency scan"
          fi

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: peterlukas/sokoni-web:scan
          load: true

      # 🔒 SECURITY GATE 4: Container Image Scanning
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: peterlukas/sokoni-web:scan
          severity: CRITICAL,HIGH
          exit-code: 0
        continue-on-error: true

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker tag peterlukas/sokoni-web:scan ${{ secrets.DOCKERHUB_USERNAME }}/sokoni-web:latest
          docker tag peterlukas/sokoni-web:scan ${{ secrets.DOCKERHUB_USERNAME }}/sokoni-web:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sokoni-web:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/sokoni-web:${{ github.sha }}
